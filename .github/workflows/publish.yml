name: Publish

# Cut a release by pushing a tag, e.g.:
#   git tag v0.2.0 && git push origin v0.2.0
# The package version is taken from the tag (v0.2.0 -> 0.2.0).
#
# Auth: NuGet Trusted Publishing (OIDC) — no long-lived API key secret.
# One-time setup on nuget.org (your username -> Trusted Publishing -> add policy):
#   Repository Owner: brunocpf
#   Repository:       com.brunocpf.modifiable-property
#   Workflow File:    publish.yml          (file name only, no path)
#   Environment:      (leave empty)
# Then add a repo secret NUGET_USER = your nuget.org profile name (NOT your email).
on:
  push:
    tags: [ 'v*' ]

jobs:
  publish:
    name: Pack & push to NuGet.org
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # mint the GitHub OIDC token that Trusted Publishing exchanges
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Derive version from tag
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Test (gate the release)
        run: dotnet test BrunoCPF.Modifiable.slnx -c Release

      - name: Pack
        run: >
          dotnet pack src/BrunoCPF.Modifiable/BrunoCPF.Modifiable.csproj
          -c Release -p:Version=$VERSION -o out

      # Exchange the OIDC token for a short-lived (1 h) NuGet API key, right
      # before push so it can't expire in transit.
      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: >
          dotnet nuget push "out/*.nupkg"
          --source https://api.nuget.org/v3/index.json
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --skip-duplicate
