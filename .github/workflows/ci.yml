name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          # The 10 SDK builds the solution (.slnx) and the netstandard2.1 library,
          # and its runtime hosts the net10.0 tests.
          dotnet-version: 10.0.x

      # Enforces .editorconfig whitespace rules (LF, final newline, indentation) on the
      # library and test sources.
      - name: Check formatting
        run: dotnet format whitespace BrunoCPF.Modifiable.slnx --verify-no-changes

      - name: Test
        run: dotnet test BrunoCPF.Modifiable.slnx -c Release
