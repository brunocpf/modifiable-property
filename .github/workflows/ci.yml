name: CI

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build-test:
    name: Build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-dotnet@v5
        with:
          # 10 SDK builds the solution (.slnx) and netstandard2.1 library;
          # 9 runtime runs the net9.0 test host.
          dotnet-version: |
            9.0.x
            10.0.x

      - name: Test
        run: dotnet test BrunoCPF.Modifiable.slnx -c Release
